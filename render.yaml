services:
  # Backend API Service
  - type: web
    name: recipe-book-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        value: mongodb+srv://recipe_user:RecipePass123@cluster0.demo.mongodb.net/recipe_book?retryWrites=true&w=majority

  # Frontend Static Application
  - type: web
    name: recipe-book-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
